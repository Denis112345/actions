name: Shared Deploy Template

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      deploy_env:
        required: true
        type: string
    # Явно объявляем ожидаемые секреты
    secrets:
      DEV_SSH_HOST:
        required: true
      DEV_SSH_USER:
        required: true
      DEV_SSH_KEY:
        required: true
      DEV_SSH_PORT:
        required: true
      ALLOW_REPOS:
        required: true

jobs:
  check-repo:
    runs-on: self-hosted
    steps:
      - name: Check if repo is allowed
        run: |
          ALLOWED_REPOS="${{ secrets.ALLOW_REPOS }}"
          CURRENT_REPO="${{ github.event.repository.name }}"
          
          if [[ ",$ALLOWED_REPOS," == *",$CURRENT_REPO,"* ]]; then
            echo "Access granted"
          else
            echo "Access denied"
            exit 1
          fi
  deploy:
    runs-on: self-hosted
    needs: check-repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing ssh deploy command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            cd ~/sp-kuber/configs && \
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
            
            if env "APP=${{ inputs.app_name }}" "BRANCH=${{ github.ref_name }}" "MODE=prod" bun utils.ts switch-branch; then
              STATUS="Success"
            else
              STATUS="Failed"
            fi

            END_TIME=$(date +'%H:%M:%S')

            curl -X POST http://localhost:30012/notify \
              -H "Content-Type: application/json" \
              -d "{
                \"service\": \"${{ inputs.app_name }}\",
                \"status\": \"$STATUS\",
                \"branch\": \"${{ github.ref_name }}\",
                \"time\": \"$END_TIME\",
                \"env\": \"${{ inputs.deploy_env }}\",
                \"actionUrl\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }"